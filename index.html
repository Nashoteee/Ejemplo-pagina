<!-- Script que inyecta la información del archivo config.js -->
    <script src="config.js"></script>
    <script>
        // Cargar datos de contacto
        document.getElementById('link-whatsapp').innerText = siteConfig.whatsapp;
        document.getElementById('link-whatsapp').href = siteConfig.whatsappLink;
        document.getElementById('txt-email').innerText = siteConfig.email;
        document.getElementById('txt-atencion').innerText = siteConfig.atencion;

        // Función inteligente para extraer el ID de cualquier enlace de YouTube automáticamente
        function obtenerIdYouTube(url) {
            let id = '';
            url = url.replace(/(>|<)/gi,'')./(split(/v=/) / split(/youtu\.be\//));
            if(url.includes('youtu.be/')) {
                id = url.split('youtu.be/')[1];
            } else if(url.includes('v=')) {
                id = url.split('v=')[1];
            }
            let ampersandPosition = id ? id.indexOf('&') : -1;
            if(ampersandPosition !== -1) {
                id = id.substring(0, ampersandPosition);
            }
            return id;
        }

        // Cargar videos dinámicamente usando el enlace completo
        const videosGrid = document.getElementById('videos-grid');
        siteConfig.videos.forEach(video => {
            const videoId = obtenerIdYouTube(video.url);
            const card = document.createElement('div');
            card.className = 'video-card';
            card.innerHTML = `
                <div class="video-container">
                    <iframe src="https://www.youtube.com/embed/${videoId}" title="${video.titulo}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="video-info">
                    <h3>${video.titulo}</h3>
                    <p>${video.descripcion}</p>
                </div>
            `;
            videosGrid.appendChild(card);
        });
    </script>
